# Reverse proxy for the API, static host for the admin panel, and the only thing
# that terminates TLS. Everything else in the stack listens on the private
# network and is unreachable from outside.
#
# Replace stride.example.com with the real hostname before the first deploy;
# certbot writes its certificate under that exact name.

upstream stride_backend {
    server backend:8000;
    keepalive 32;
}

upstream stride_admin {
    server admin:80;
}

# Step sync and sign-in are the two endpoints worth rate limiting: one is called
# by every device on a timer, the other is where credential stuffing lands.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;

# --- HTTP: ACME challenges, and a redirect for everything else ---------------
server {
    listen 80;
    server_name stride.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS -------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name stride.example.com;

    ssl_certificate     /etc/letsencrypt/live/stride.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stride.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Story video is the largest thing anyone uploads; the API enforces its own
    # limits, this is only the outer bound.
    client_max_body_size 64m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # --- media ---------------------------------------------------------------
    # Served straight off the volume. `nosniff` plus a fixed disposition matters
    # here: this path serves user-uploaded bytes, and letting a browser interpret
    # them as HTML on our own origin would be stored XSS.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # --- API -----------------------------------------------------------------
    location /v1/auth/ {
        limit_req zone=api_auth burst=20 nodelay;
        proxy_pass http://stride_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location /v1/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://stride_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    location = /health {
        proxy_pass http://stride_backend;
        access_log off;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # Interactive API docs are staff tooling, not a public surface.
    location ~ ^/(docs|redoc|openapi.json) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://stride_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # --- admin panel ---------------------------------------------------------
    location / {
        proxy_pass http://stride_admin;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }
}
