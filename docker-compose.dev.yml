# Local development: just the two data stores.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# The backend and the two frontends run on the host with hot reload, so there is
# no point building images for them. Ports are published here — unlike production,
# where nothing but nginx is reachable.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stride
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: stride
    ports:
      - "5432:5432"
    volumes:
      - devpg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  devpg:
